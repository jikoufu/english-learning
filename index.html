<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>英语学习</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #20242a;
      --muted: #667085;
      --line: #d8dee8;
      --blue: #2563eb;
      --green: #0f8a65;
      --amber: #b45309;
      --rose: #be123c;
      --shadow: 0 12px 30px rgba(24, 35, 58, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
    }

    .sidebar {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 24px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .status {
      min-width: 72px;
      border: 1px solid #b9d6c9;
      border-radius: 999px;
      padding: 6px 10px;
      color: var(--green);
      background: #edf8f3;
      font-size: 13px;
      text-align: center;
      white-space: nowrap;
    }

    .search {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }

    .search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
    }

    .stat strong {
      display: block;
      font-size: 22px;
      line-height: 1.1;
    }

    .stat span {
      display: block;
      margin-top: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .nav-title {
      margin: 22px 0 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .date-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .date-button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .date-button.active {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .main {
      padding: 30px;
      min-width: 0;
    }

    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .toolbar p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .reload {
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .reload:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .speak-all,
    .review-refresh,
    .voice-button,
    .inline-voice-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }

    .speak-all,
    .review-refresh {
      height: 40px;
      padding: 0 14px;
      white-space: nowrap;
    }

    .review-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .review-toolbar p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .srs-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .srs-card {
      grid-column: 1 / -1;
      max-width: 760px;
      margin: 0 auto;
      width: 100%;
    }

    .srs-prompt {
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    .srs-prompt .word-title {
      font-size: 34px;
    }

    .srs-answer {
      margin-top: 18px;
    }

    .srs-answer[hidden] {
      display: none;
    }

    .srs-show,
    .srs-rating {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0 14px;
      cursor: pointer;
    }

    .srs-show {
      display: block;
      margin: 18px auto 0;
    }

    .srs-show:hover,
    .srs-rating:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .srs-ratings {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
    }

    .srs-rating.again { border-color: #dc2626; color: #b91c1c; }
    .srs-rating.hard { border-color: #d97706; color: #b45309; }
    .srs-rating.good { border-color: #2563eb; color: #1d4ed8; }
    .srs-rating.easy { border-color: #16a34a; color: #15803d; }

    @media (max-width: 560px) {
      .srs-ratings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    .voice-button {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--blue);
    }

    .inline-voice-button {
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      color: var(--blue);
      vertical-align: middle;
      font-size: 12px;
      line-height: 1;
    }

    .speak-all:hover,
    .review-refresh:hover,
    .voice-button:hover,
    .inline-voice-button:hover {
      border-color: var(--blue);
      color: var(--blue);
    }

    .voice-button[aria-pressed="true"],
    .inline-voice-button[aria-pressed="true"] {
      color: #ffffff;
      background: var(--blue);
      border-color: var(--blue);
    }

    .topic {
      margin: 0 0 18px;
      padding: 12px 14px;
      border-left: 4px solid var(--amber);
      background: #fff8ed;
      border-radius: 0 8px 8px 0;
      color: #713f12;
    }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 16px;
    }

    .word-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 18px;
      min-width: 0;
    }

    .word-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 12px;
    }

    .word-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .word-index {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .field {
      margin: 10px 0;
      line-height: 1.65;
    }

    .field-name {
      color: var(--blue);
      font-weight: 700;
    }

    .sub-list {
      margin: 8px 0 0 18px;
      padding: 0;
      color: #394150;
      line-height: 1.7;
    }

    .review-panel {
      margin-top: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .review-panel h3 {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .review-list {
      margin: 0;
      padding-left: 20px;
      line-height: 1.7;
      color: #394150;
    }

    .empty,
    .error {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 22px;
      color: var(--muted);
    }

    .error {
      border-color: #fecdd3;
      color: var(--rose);
      background: #fff1f2;
    }

    mark {
      background: #fde68a;
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .main {
        padding: 22px;
      }

      .toolbar {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>英语学习</h1>
        <div class="status" id="status">读取中</div>
      </div>

      <input class="search" id="search" type="search" placeholder="搜索单词、中文、例句">

      <div class="stats">
        <div class="stat">
          <strong id="wordCount">0</strong>
          <span>单词</span>
        </div>
        <div class="stat">
          <strong id="dateCount">0</strong>
          <span>学习日</span>
        </div>
      </div>

      <div class="nav-title">学习日期</div>
      <div class="date-list" id="dateList"></div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <div>
          <h2 id="currentDate">学习记录</h2>
          <p id="summary">自动读取 英语学习.md</p>
        </div>
        <div class="actions">
          <button class="speak-all" id="speakAll" type="button">朗读当前日期</button>
          <button class="reload" id="reload" type="button">刷新</button>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <script>
    const state = {
      days: [],
      activeDate: "",
      query: "",
      activeView: "words",
      reviewWords: [],
      reviewIndex: 0,
      reviewAnswerShown: false
    };

    const el = {
      status: document.querySelector("#status"),
      search: document.querySelector("#search"),
      wordCount: document.querySelector("#wordCount"),
      dateCount: document.querySelector("#dateCount"),
      dateList: document.querySelector("#dateList"),
      currentDate: document.querySelector("#currentDate"),
      summary: document.querySelector("#summary"),
      content: document.querySelector("#content"),
      reload: document.querySelector("#reload"),
      speakAll: document.querySelector("#speakAll")
    };

    function cleanSpeechText(value) {
      return value
        .replace(/^\d+\.\s*/, "")
        .replace(/[^\w\s-]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getEnglishVoice() {
      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
      return voices.find(voice => voice.lang === "en-US")
        || voices.find(voice => voice.lang && voice.lang.startsWith("en-"))
        || null;
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) {
        el.status.textContent = "不支持语音";
        return;
      }

      const speechText = cleanSpeechText(text);
      if (!speechText) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = "en-US";
      utterance.rate = 0.86;
      utterance.pitch = 1;
      utterance.voice = getEnglishVoice();
      utterance.onstart = () => {
        el.status.textContent = "朗读中";
      };
      utterance.onend = () => {
        el.status.textContent = "已同步";
      };
      utterance.onerror = () => {
        el.status.textContent = "朗读失败";
      };
      window.speechSynthesis.speak(utterance);
    }

    function speakWords(words) {
      if (!("speechSynthesis" in window)) {
        el.status.textContent = "不支持语音";
        return;
      }

      window.speechSynthesis.cancel();
      const voice = getEnglishVoice();
      const queue = words.map(item => cleanSpeechText(item.word)).filter(Boolean);

      if (!queue.length) return;

      for (const word of queue) {
        const utterance = new SpeechSynthesisUtterance(word);
        utterance.lang = "en-US";
        utterance.rate = 0.82;
        utterance.pitch = 1;
        utterance.voice = voice;
        utterance.onstart = () => {
          el.status.textContent = "朗读中";
        };
        utterance.onend = () => {
          if (!window.speechSynthesis.speaking) {
            el.status.textContent = "已同步";
          }
        };
        window.speechSynthesis.speak(utterance);
      }
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function highlight(value) {
      const safe = escapeHtml(value);
      const query = state.query.trim();
      if (!query) return safe;
      const pattern = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safe.replace(new RegExp(pattern, "gi"), match => `<mark>${match}</mark>`);
    }

    function isCoreField(fieldName) {
      return ["核心动词", "核心形容词", "核心词", "动词原形", "单数形式"].includes(fieldName);
    }

    function renderSpeakableValue(field) {
      const value = highlight(field.value);
      if (!isCoreField(field.name) || !field.value.trim()) return value;
      const speechText = cleanSpeechText(field.value);
      if (!speechText) return value;
      return `${value}<button class="inline-voice-button" type="button" data-word="${escapeHtml(speechText)}" aria-label="朗读 ${escapeHtml(speechText)}" title="朗读 ${escapeHtml(speechText)}"><span aria-hidden="true">▶</span></button>`;
    }

    function bindVoiceButtons() {
      el.content.querySelectorAll(".voice-button, .inline-voice-button").forEach(button => {
        button.addEventListener("click", () => speakText(button.dataset.word || ""));
      });
    }

    function renderWordCard(item, fallbackIndex) {
      const index = item.index || String(fallbackIndex);
      const fields = item.fields.map(field => {
        const children = field.children.length
          ? `<ul class="sub-list">${field.children.map(child => `<li>${highlight(child)}</li>`).join("")}</ul>`
          : "";
        return `
          <div class="field">
            <span class="field-name">${highlight(field.name)}：</span>${renderSpeakableValue(field)}
            ${children}
          </div>
        `;
      }).join("");

      return `
        <article class="word-card">
          <div class="word-head">
            <h3 class="word-title">${highlight(item.word)}</h3>
            <button class="voice-button" type="button" data-word="${escapeHtml(item.word)}" aria-label="朗读 ${escapeHtml(item.word)}" title="朗读 ${escapeHtml(item.word)}">
              <span aria-hidden="true">▶</span>
            </button>
            <span class="word-index">#${escapeHtml(index)}</span>
          </div>
          ${fields}
        </article>
      `;
    }

    function getAllLearnedWords() {
      return state.days.flatMap(day => {
        return day.words.map(item => ({
          ...item,
          fields: [
            {
              name: "学习日期",
              value: day.date,
              children: []
            },
            ...item.fields
          ]
        }));
      });
    }

    const SRS_KEY = "english-learning-srs-v1";

    function readSrs() {
      try { return JSON.parse(localStorage.getItem(SRS_KEY) || "{}"); }
      catch { return {}; }
    }

    function srsKey(item) {
      return cleanSpeechText(item.word).toLowerCase();
    }

    function todayIso() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now.getTime() - offset).toISOString().slice(0, 10);
    }

    function addDays(dateText, days) {
      const date = new Date(`${dateText}T12:00:00`);
      date.setDate(date.getDate() + days);
      return date.toISOString().slice(0, 10);
    }

    function getSrsStats() {
      const records = readSrs();
      const all = getAllLearnedWords();
      const today = todayIso();
      const due = all.filter(item => !records[srsKey(item)] || (records[srsKey(item)].due || today) <= today).length;
      const learned = all.filter(item => records[srsKey(item)] && records[srsKey(item)].reviews > 0).length;
      return { due, learned, total: all.length };
    }

    function scheduleReview(item, rating) {
      const records = readSrs();
      const key = srsKey(item);
      const old = records[key] || { interval: 0, reviews: 0, streak: 0 };
      let interval;
      let streak = old.streak || 0;
      if (rating === "again") { interval = 0; streak = 0; }
      if (rating === "hard") { interval = Math.max(1, Math.round((old.interval || 1) * 1.2)); }
      if (rating === "good") {
        streak += 1;
        interval = streak === 1 ? 1 : streak === 2 ? 3 : Math.max(4, Math.round((old.interval || 3) * 2.2));
      }
      if (rating === "easy") {
        streak += 1;
        interval = Math.max(4, Math.round((old.interval || 2) * 2.5));
      }
      records[key] = { interval, due: addDays(todayIso(), interval), reviews: (old.reviews || 0) + 1, streak, last: todayIso() };
      localStorage.setItem(SRS_KEY, JSON.stringify(records));
    }

    function refreshReviewWords() {
      const pool = getAllLearnedWords();
      const records = readSrs();
      const today = todayIso();
      const due = pool.filter(item => !records[srsKey(item)] || (records[srsKey(item)].due || today) <= today);
      const source = due.length ? due : pool;
      const shuffled = [...source];
      for (let i = shuffled.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      state.reviewWords = shuffled.slice(0, 5);
      state.reviewIndex = 0;
      state.reviewAnswerShown = false;
    }

    function extractReviewWord(reviewItem) {
      const backtickMatch = reviewItem.match(/`([^`]+)`/);
      if (backtickMatch) return backtickMatch[1].trim();
      const firstToken = reviewItem.split(/[：:\s]/)[0];
      return firstToken ? cleanSpeechText(firstToken) : "";
    }

    function findLearnedWord(word) {
      const normalized = cleanSpeechText(word).toLowerCase();
      if (!normalized) return null;
      for (const day of state.days) {
        for (const item of day.words) {
          if (cleanSpeechText(item.word).toLowerCase() === normalized) {
            return item;
          }
        }
      }
      return null;
    }

    function makeReviewWord(reviewItem, index) {
      const word = extractReviewWord(reviewItem);
      const learnedWord = findLearnedWord(word);
      const reviewField = {
        name: "回顾重点",
        value: reviewItem,
        children: []
      };

      if (learnedWord) {
        return {
          ...learnedWord,
          index: String(index),
          fields: [reviewField, ...learnedWord.fields]
        };
      }

      return {
        index: String(index),
        word: word || `review ${index}`,
        fields: [reviewField]
      };
    }

    function parseMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      const days = [];
      let currentDay = null;
      let currentWord = null;
      let pendingField = null;
      let reviewMode = false;

      for (const rawLine of lines) {
        const line = rawLine.trimEnd();
        const dateMatch = line.match(/^##\s+(\d{4}-\d{2}-\d{2})\s*$/);
        const wordMatch = line.match(/^###\s+(?:(\d+)\.\s*)?(.+?)\s*$/);
        const reviewMatch = line.match(/^####\s+回顾模块\s*$/);
        const topicMatch = line.match(/^主题：(.+?)\s*$/);
        const fieldMatch = line.match(/^-\s*([^：:]+)[：:]\s*(.*)$/);
        const nestedMatch = line.match(/^\s{2,}-\s+(.+)$/);
        const reviewItemMatch = line.match(/^-\s+(.+)$/);

        if (dateMatch) {
          currentDay = { date: dateMatch[1], topic: "", words: [], review: [] };
          days.push(currentDay);
          currentWord = null;
          pendingField = null;
          reviewMode = false;
          continue;
        }

        if (!currentDay) continue;

        if (topicMatch) {
          currentDay.topic = topicMatch[1];
          continue;
        }

        if (reviewMatch) {
          reviewMode = true;
          currentWord = null;
          pendingField = null;
          continue;
        }

        if (reviewMode && reviewItemMatch) {
          currentDay.review.push(reviewItemMatch[1]);
          continue;
        }

        if (wordMatch) {
          reviewMode = false;
          currentWord = {
            index: wordMatch[1] || String(currentDay.words.length + 1),
            word: wordMatch[2],
            fields: []
          };
          currentDay.words.push(currentWord);
          pendingField = null;
          continue;
        }

        if (!currentWord) continue;

        if (fieldMatch) {
          pendingField = {
            name: fieldMatch[1],
            value: fieldMatch[2],
            children: []
          };
          currentWord.fields.push(pendingField);
          continue;
        }

        if (nestedMatch && pendingField) {
          pendingField.children.push(nestedMatch[1]);
        }
      }

      return days.reverse();
    }

    function wordMatchesQuery(item, query) {
      const text = [
        item.word,
        ...item.fields.flatMap(field => [field.name, field.value, ...field.children])
      ].join(" ").toLowerCase();
      return text.includes(query);
    }

    function dayMatches(day) {
      const query = state.query.trim().toLowerCase();
      if (!query) return day;
      const words = day.words.filter(item => wordMatchesQuery(item, query));
      return { ...day, words };
    }

    function getGlobalSearchResults() {
      const query = state.query.trim().toLowerCase();
      if (!query) return [];
      return getAllLearnedWords().filter(item => wordMatchesQuery(item, query));
    }

    function renderDates() {
      el.dateList.innerHTML = "";
      const totalWords = state.days.reduce((sum, day) => sum + day.words.length, 0);
      if (totalWords) {
        const dueCount = getSrsStats().due;
        const reviewButton = document.createElement("button");
        reviewButton.type = "button";
        reviewButton.className = `date-button${state.activeView === "review" ? " active" : ""}`;
        reviewButton.innerHTML = `<span>回顾模块</span><span>${dueCount}</span>`;
        reviewButton.addEventListener("click", () => {
          state.activeView = "review";
          if (!state.reviewWords.length) refreshReviewWords();
          render();
        });
        el.dateList.appendChild(reviewButton);
      }

      for (const day of state.days) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `date-button${state.activeView === "words" && day.date === state.activeDate ? " active" : ""}`;
        button.innerHTML = `<span>${escapeHtml(day.date)}</span><span>${day.words.length}</span>`;
        button.addEventListener("click", () => {
          state.activeView = "words";
          state.activeDate = day.date;
          render();
        });
        el.dateList.appendChild(button);
      }
    }

    function getActiveReviewDay() {
      const activeDay = state.days.find(day => day.date === state.activeDate);
      if (activeDay && activeDay.review && activeDay.review.length) return activeDay;
      return state.days.find(day => day.review && day.review.length) || null;
    }

    function renderReviewContent() {
      const totalWords = state.days.reduce((sum, day) => sum + day.words.length, 0);
      if (!totalWords) {
        el.currentDate.textContent = "回顾模块";
        el.summary.textContent = "暂无回顾内容";
        el.content.innerHTML = '<div class="empty">还没有回顾记录。</div>';
        return;
      }

      if (!state.reviewWords.length) refreshReviewWords();

      const current = state.reviewWords[state.reviewIndex];
      if (!current) {
        refreshReviewWords();
        return renderReviewContent();
      }
      const stats = getSrsStats();
      const record = readSrs()[srsKey(current)] || { interval: 0, reviews: 0 };
      const answer = renderWordCard(current, state.reviewIndex + 1);

      el.currentDate.textContent = "回顾模块";
      el.summary.textContent = `今日到期 ${stats.due} 个 · 已学习 ${stats.learned} / ${stats.total} 个 · 当前间隔 ${record.interval || 0} 天`;

      el.content.innerHTML = `
        <div class="review-toolbar">
          <div>
            <p>先回忆单词，再显示答案并评价记忆程度。</p>
            <div class="srs-stats"><span>本组 ${state.reviewIndex + 1} / ${state.reviewWords.length}</span><span>到期词优先</span></div>
          </div>
          <button class="review-refresh" id="refreshReview" type="button">刷新回顾</button>
        </div>
        <section class="word-grid">
          <article class="word-card srs-card">
            <div class="srs-prompt">
              <h3 class="word-title">${highlight(current.word)}</h3>
              <button class="srs-show" id="showAnswer" type="button">显示答案</button>
              <div class="srs-answer" id="srsAnswer" ${state.reviewAnswerShown ? "" : "hidden"}>
                ${answer}
                <div class="srs-ratings">
                  <button class="srs-rating again" data-rating="again" type="button">重来<br><small>今天重现</small></button>
                  <button class="srs-rating hard" data-rating="hard" type="button">困难<br><small>短间隔</small></button>
                  <button class="srs-rating good" data-rating="good" type="button">良好<br><small>正常增长</small></button>
                  <button class="srs-rating easy" data-rating="easy" type="button">简单<br><small>长间隔</small></button>
                </div>
              </div>
            </div>
          </article>
        </section>
      `;
      document.querySelector("#refreshReview").addEventListener("click", () => {
        refreshReviewWords();
        renderReviewContent();
      });
      document.querySelector("#showAnswer").addEventListener("click", () => {
        state.reviewAnswerShown = true;
        renderReviewContent();
      });
      el.content.querySelectorAll(".srs-rating").forEach(button => {
        button.addEventListener("click", () => {
          scheduleReview(current, button.dataset.rating);
          state.reviewIndex += 1;
          state.reviewAnswerShown = false;
          if (state.reviewIndex >= state.reviewWords.length) refreshReviewWords();
          renderReviewContent();
        });
      });
      bindVoiceButtons();
    }

    function renderContent() {
      if (state.query.trim()) {
        const results = getGlobalSearchResults();
        el.currentDate.textContent = "全局搜索";
        el.summary.textContent = `搜索结果：${results.length} 个单词`;

        if (!results.length) {
          el.content.innerHTML = '<div class="empty">没有匹配的单词。</div>';
          return;
        }

        const cards = results.map((item, index) => renderWordCard(item, index + 1)).join("");
        el.content.innerHTML = `<section class="word-grid">${cards}</section>`;
        bindVoiceButtons();
        return;
      }

      if (state.activeView === "review") {
        renderReviewContent();
        return;
      }

      const originalDay = state.days.find(day => day.date === state.activeDate);
      if (!originalDay) {
        el.content.innerHTML = '<div class="empty">还没有学习记录。</div>';
        return;
      }

      const day = dayMatches(originalDay);
      el.currentDate.textContent = day.date;
      el.summary.textContent = `${originalDay.words.length} 个单词`;

      if (!day.words.length) {
        el.content.innerHTML = '<div class="empty">没有匹配的单词。</div>';
        return;
      }

      const topic = day.topic ? `<p class="topic">${highlight(day.topic)}</p>` : "";
      const cards = day.words.map((item, index) => renderWordCard(item, index + 1)).join("");

      el.content.innerHTML = `${topic}<section class="word-grid">${cards}</section>`;
      bindVoiceButtons();
    }

    function render() {
      const totalWords = state.days.reduce((sum, day) => sum + day.words.length, 0);
      el.wordCount.textContent = totalWords;
      el.dateCount.textContent = state.days.length;
      renderDates();
      renderContent();
    }

    async function loadMarkdown() {
      el.status.textContent = "读取中";
      try {
        const response = await fetch(`./英语学习.md?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const markdown = await response.text();
        state.days = parseMarkdown(markdown);
        state.reviewWords = [];
        state.activeDate = state.activeDate || (state.days[0] && state.days[0].date) || "";
        el.status.textContent = "已同步";
        render();
      } catch (error) {
        el.status.textContent = "失败";
        el.content.innerHTML = `
          <div class="error">
            无法自动读取 英语学习.md。请用本地服务器打开这个页面，例如运行：
            <br>python -m http.server 8000
          </div>
        `;
      }
    }

    el.search.addEventListener("input", event => {
      state.query = event.target.value;
      render();
    });

    el.reload.addEventListener("click", loadMarkdown);

    el.speakAll.addEventListener("click", () => {
      if (state.query.trim()) {
        speakWords(getGlobalSearchResults());
        return;
      }

      if (state.activeView === "review") {
        if (!state.reviewWords.length) refreshReviewWords();
        speakWords(state.reviewWords);
        return;
      }

      const originalDay = state.days.find(day => day.date === state.activeDate);
      if (!originalDay) return;
      speakWords(dayMatches(originalDay).words);
    });

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = getEnglishVoice;
    }

    loadMarkdown();
  </script>
</body>
</html>
